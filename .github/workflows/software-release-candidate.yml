name: SDK 0.4.66 release candidate
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-software-release.mjs'
      - '.github/workflows/software-release-candidate.yml'
      - 'packages/vanta-sdk/browser/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.1'
          cache: npm
      - run: npm install -g npm@11.11.0 --no-audit --no-fund
      - run: npm ci
      - run: npm run verify:release -- 0.4.65
      - run: npm test
      - run: npm run build
      - name: Construct exact unsigned publication and record hashes
        run: node scripts/prepare-software-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-sdk-0.4.66
          path: .release-candidate/
          retention-days: 14
          if-no-files-found: error
