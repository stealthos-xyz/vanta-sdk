name: Verify activated SDK 0.4.67
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sdk0467-activation-readback.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify operator signature and archive for consumer pinning
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {assertSignedChikyuSdkPublication} from './scripts/sdk-publication-signature.mjs';
          const base='https://stealthos.xyz/ceremony/dogeos/kzg-live-001/api/release/';
          const response=await fetch(base+'current',{redirect:'error',cache:'no-store',signal:AbortSignal.timeout(30000)});
          assert.equal(response.status,200);
          const p=await response.json();
          assert.equal(assertSignedChikyuSdkPublication(p),'0x06cf8a2ebad841c78e7015c7218ac634342c5f69d1be6bf9873ce852cd3ad435');
          assert.equal(p.version,'0.4.67');
          assert.equal(p.wrapperSourceCommit,'9e516704f3f540e68011a7d4dfd6bc8b755faeea');
          assert.equal(p.artifactBaseUrl,base+'artifacts/');
          const pin=p.sdkPackage;
          assert.equal(pin.sha256,'dcda8b710350becf2bb9501fb482fac1a54e405abfdf8f8bdec76d76a4efb881');
          assert.equal(pin.path,'objects/'+pin.sha256+'.tgz');
          assert.equal(pin.bytes,1669629);
          const archive=await fetch(new URL(pin.path,p.artifactBaseUrl),{redirect:'error',signal:AbortSignal.timeout(30000)});
          assert.equal(archive.status,200);
          const bytes=Buffer.from(await archive.arrayBuffer());
          assert.equal(bytes.length,pin.bytes);
          assert.equal(createHash('sha256').update(bytes).digest('hex'),pin.sha256);
          console.log('VERIFIED_PUBLIC_RELEASE '+JSON.stringify({version:p.version,signature:p.signature,artifactBaseUrl:p.artifactBaseUrl,integrity:'sha512-'+createHash('sha512').update(bytes).digest('base64')}));
          EOF
