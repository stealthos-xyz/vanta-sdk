name: Import approved FYEO PDF bytes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-fyeo-pdf-once.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reassemble and verify exact approved PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pdf="$RUNNER_TEMP/fyeo.pdf"
          : > "$pdf"
          for sha in b167af210e3c04448aba711abd6645d5a5d4fbd9 303e9793c6a2d9c3368333ac0f1da2184e9f608c 08707bafc0d27d45dd6c6da12f6d9ced95a230f7 e7762510e42395efa013ee222272e4af2fb2d1f1 84ab4183777b1ab95d6dd7fd60bdbb2d99b8da5e c3f0bac488b84c405ebb54a8288ecbbc7832face 40e26d8baeb2f7fa720c821ea6642f0dc821b687 10118a75992f40010072f78a3fa66a360c20ca3a c9e2ecbd117d0c61110d6d90b1c139f20a93b14f 4e401c9a54ba55c375e92c31937ab25ebf377078 43d4a96c680f64fb3d3e8d1b1b0927c6cfde5030 62243227413be515c4aee2d14cc77cc4a87dd661 742970f5bc0488cb6935232c4825eb3b4af5d3b6 03ac7f26cdf41f1143db0a9073dbe88864638529 82560dcc831cc2cad9a00c566eac54a1d8951a5e cdc503f2d4cde05652b4c3c1f84937e1a3cefc43; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq '.content' | base64 -d >> "$pdf"
          done
          test "$(wc -c < "$pdf")" -eq 5562694
          echo "073c8bf689ade59dac2e8a29bafdae6127e901381f992b606314d794c987aea7  $pdf" | sha256sum -c -
          test "$(git hash-object "$pdf")" = "6d3e73436b385c6b9d1307d0d07659d6ac4f1e82"
          python3 - "$pdf" "$RUNNER_TEMP/blob.json" <<'PY'
          import base64, json, sys
          with open(sys.argv[1], "rb") as src, open(sys.argv[2], "w") as dst:
              json.dump({"encoding": "base64", "content": base64.b64encode(src.read()).decode("ascii")}, dst)
          PY
          sha="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq .sha)"
          test "$sha" = "6d3e73436b385c6b9d1307d0d07659d6ac4f1e82"
          echo "Verified full PDF Git blob: $sha"
